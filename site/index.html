<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TAK.NZ mobile app</title>
    <meta name="description" content="The TAK.NZ mobile app for Android and iOS.">
    <link rel="icon" href="/favicon.ico">
    <style>
        :root { --blue: #003366; --dark: #002244; --accent: #004499; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: #1d273b;
            background: #f4f6fa;
        }
        header { background: var(--blue); color: #fff; padding: 1.25rem 1.5rem; border-bottom: 3px solid var(--dark); }
        header a { color: #fff; text-decoration: none; font-weight: 600; font-size: 1.25rem; }
        main { flex: 1; width: 100%; max-width: 40rem; margin: 0 auto; padding: 2.5rem 1.5rem; }
        h1 { margin: 0 0 .5rem; color: var(--blue); font-size: 2rem; }
        h1 em { color: var(--accent); }
        p { line-height: 1.55; }
        .note { padding: 1rem 1.25rem; border-left: 4px solid var(--accent); background: #fff; }
        a { color: var(--accent); }
        footer { padding: 1.5rem; text-align: center; color: #fff; background: var(--dark); font-size: .9rem; }
        footer a { color: #fff; }
    </style>
</head>
<body>
    <header><a href="https://tak.nz">TAK.NZ</a></header>
    <main>
        <h1>TAK.NZ <em>mobile</em> app</h1>
        <p>See your team, share information, save lives. The TAK.NZ app brings the shared operational picture to your phone.</p>
        <p class="note">Download links for Android and iOS will appear here.</p>
        <p>Learn more about TAK.NZ at <a href="https://tak.nz">tak.nz</a>.</p>
    </main>
    <footer>Team Awareness Kit New Zealand &middot; <a href="https://tak.nz">tak.nz</a></footer>
</body>
</html>
